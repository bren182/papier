appId: com.papier.app
productName: Papier
copyright: MIT

# Icons: place icon.ico (Windows), icon.png (Linux ≥ 256×256), icon.icns (macOS) in build/.
# If omitted, electron-builder uses the default Electron icon.

# Tells electron-updater where to check for new releases.
# --publish never in the dist scripts stops electron-builder from uploading here;
# the CI workflow handles artifact upload via softprops/action-gh-release.
publish:
  provider: github
  owner: bren182
  repo: papier

directories:
  buildResources: build
  output: release

# asar: false — better-sqlite3's .node binary cannot live inside an asar archive.
asar: false

# N-API prebuilts are not fully ABI-stable across major Node versions: CI installs
# the Node 24 prebuild, which crashes in Electron 33's embedded Node 20.
# bundle-server.mjs runs @electron/rebuild to write an Electron-compatible binary
# into dist/node_modules/better-sqlite3/ before packaging.
# Keep npmRebuild: false — electron-builder's own rebuild pass hits ENOENT on
# pnpm symlinks in the workspace and would overwrite the correct binary anyway.
npmRebuild: false

files:
  - src/**
  - dist/**
  - build/**
  - package.json

# electron-builder's smart-excludes strip any nested node_modules/ from the
# files: list above, so the rebuilt better-sqlite3 must be included here.
# Source (deps/, src/) is omitted — only the runtime JS and compiled binary
# are needed.
extraFiles:
  - from: dist/node_modules/better-sqlite3
    to: resources/app/dist/node_modules/better-sqlite3
    filter:
      - "**"
      - "!src/**"
      - "!deps/**"
      - "!prebuilds/**"
  # better-sqlite3 v12 runtime deps: bindings + file-uri-to-path
  - from: dist/node_modules/bindings
    to: resources/app/dist/node_modules/bindings
    filter: ["**"]
  - from: dist/node_modules/file-uri-to-path
    to: resources/app/dist/node_modules/file-uri-to-path
    filter: ["**"]

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  # Stable filename so the /releases/latest/download/ URL never changes.
  artifactName: Papier-Setup.exe

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Papier
  runAfterFinish: true
  installerLanguages:
    - en_US

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: build/icon.png
  category: Office
  synopsis: Self-hosted block workspace

appImage:
  artifactName: Papier-Linux.AppImage

deb:
  artifactName: papier-linux-amd64.deb
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
