appId: com.papier.app
productName: Papier
copyright: MIT

# Icons: place icon.ico (Windows), icon.png (Linux ≥ 256×256), icon.icns (macOS) in build/.
# If omitted, electron-builder uses the default Electron icon.

directories:
  buildResources: build
  output: release

# asar: false — better-sqlite3's .node binary cannot live inside an asar archive.
asar: false

files:
  - src/**
  - dist/**
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  # icon: build/icon.ico   # uncomment once you have a 256×256 ICO
  # Stable filename so the /releases/latest/download/ URL never changes.
  artifactName: Papier-Setup.exe

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Papier
  runAfterFinish: true
  installerLanguages:
    - en_US

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  # icon: build/icon.png   # uncomment once you have a 256×256 PNG
  category: Office
  synopsis: Self-hosted block workspace

appImage:
  artifactName: Papier-Linux.AppImage

deb:
  artifactName: papier-linux-amd64.deb
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
