name: Release

on:
  push:
    tags:
      - 'v*'

# Workflow overview (all triggered by a version tag, e.g. v0.4.0):
#
#  test ──┬── create-release ──┬── docker          (Linux, pushes ghcr.io image)
#          │                   ├── desktop-windows  (Windows runner → .exe)
#          │                   └── desktop-linux    (Linux runner  → .AppImage + .deb)
#
# The three build jobs run in parallel after the release is created.

jobs:
  # ── 1. Shared quality gate ────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # ── 2. Create the GitHub release (with auto-generated notes) ─────────────
  create-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}

  # ── 3a. Docker image → ghcr.io ───────────────────────────────────────────
  docker:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bren182/papier:latest
            ghcr.io/bren182/papier:${{ github.ref_name }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3b. Windows installer (.exe) ─────────────────────────────────────────
  desktop-windows:
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm desktop:win
        # GH_TOKEN lets electron-builder read release info if needed.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: apps/desktop/release/*.exe

  # ── 3c. Linux packages (.AppImage + .deb) ────────────────────────────────
  desktop-linux:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install system dependencies
        # electron-builder needs these headers to compile better-sqlite3 for Electron.
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3 make g++

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Linux packages
        run: pnpm desktop:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload packages to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
